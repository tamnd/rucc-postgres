[workspace]
members = [
    "crates/rpg",
    "crates/rpg-ar",
    "crates/rpg-shim",
]
resolver = "3"

[workspace.package]
version = "0.4.6"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/tamnd/rucc-postgres"

[workspace.dependencies]
# The path requirement tracks the workspace version above and has to be bumped with it.
rpg-shim = { path = "crates/rpg-shim", version = "0.4.3" }
libc = "0.2"
regex = "1"
# rucc's archive writer, whose Rust API is unstable by its own account, so held to one release.
rucc-archive = "=0.20.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
strip = true
