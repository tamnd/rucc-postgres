# PG6's first check, before rucc is involved: Postgres built by gcc in MSYS2's UCRT64 environment
# and linked once by ld.bfd and once by lld, each run through the regression suite. lld is the
# linker rucc's MinGW driver uses, so this finds out whether lld links Postgres correctly at all,
# with gcc's objects, before any failure on the W64 row can be blamed on rucc. lld 18 mislinked
# here before (tamnd/rucc#1515), so the job also fails when MSYS2 ships anything older than 19.
#
# The third leg is the start of the W64 row: the same build by a released rucc, which links with
# lld itself, against MSYS2's tree as its sysroot. It does not fail the run until the row is
# graded.
#
# The last job is the W64 row as the harness sees it: rpg builds the same tree with rucc through
# its shim, TAP tests included, and runs every suite under meson, so the row gets compile records
# and test records like the other three.
#
# It runs each Sunday, by hand, and on pull requests that change this file or how rpg starts a
# compiler.
name: windows

on:
  schedule:
    - cron: "23 5 * * 0"
  workflow_dispatch:
    inputs:
      rucc:
        description: rucc release to build with
        default: "0.19.0"
      pin:
        description: pin from pins.toml, a release
        default: REL_18_6
  pull_request:
    paths:
      - .github/workflows/windows.yml
      - crates/rpg/src/build.rs
      - crates/rpg/src/compiler.rs
      - crates/rpg/src/process.rs
      - crates/rpg/src/regress.rs
      - crates/rpg-shim/src/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gcc-linked:
    name: ${{ matrix.cc }}'s Postgres on W64 linked by ${{ matrix.linker }}
    runs-on: windows-2022
    continue-on-error: ${{ matrix.cc == 'rucc' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            linker: bfd
          - cc: gcc
            linker: lld
          - cc: rucc
            linker: lld
    timeout-minutes: 120
    env:
      RUCC_VERSION: ${{ inputs.rucc || '0.19.0' }}
      PIN: ${{ inputs.pin || 'REL_18_6' }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-perl
            bison
            flex
            diffutils
            tar
            bzip2
            unzip
      - name: the tools and the lld version
        run: |
          set -euo pipefail
          gcc --version | head -1
          ld --version | head -1
          ld.lld --version
          major=$(ld.lld --version | sed -n 's/.*LLD \([0-9]*\)\..*/\1/p')
          if [ -z "$major" ] || [ "$major" -lt 19 ]; then
            echo "::error::MSYS2's lld is '$major', older than 19, which mislinks Postgres (tamnd/rucc#1515)"
            exit 1
          fi
          echo "lld $major is 19 or later" >> "$GITHUB_STEP_SUMMARY"
      - name: install rucc
        if: matrix.cc == 'rucc'
        run: |
          set -euo pipefail
          name="rucc-v$RUCC_VERSION-x86_64-pc-windows-msvc"
          cd "$RUNNER_TEMP"
          base="https://github.com/tamnd/rucc/releases/download/v$RUCC_VERSION"
          curl -fsSLO "$base/$name.zip"
          curl -fsSLO "$base/$name.zip.sha256"
          sha256sum -c "$name.zip.sha256"
          unzip -q "$name.zip"
          "$RUNNER_TEMP/$name/rucc.exe" --version
          echo "RUCC=$(cygpath -m "$RUNNER_TEMP/$name/rucc.exe")" >> "$GITHUB_ENV"
      - name: fetch the pin
        run: |
          set -euo pipefail
          url=$(sed -n "/^name = \"$PIN\"/,/^\$/s/^url = \"\(.*\)\"/\1/p" pins.toml)
          sha=$(sed -n "/^name = \"$PIN\"/,/^\$/s/^sha256 = \"\(.*\)\"/\1/p" pins.toml)
          if [ -z "$url" ] || [ -z "$sha" ]; then
            echo "::error::$PIN is not a release in pins.toml"
            exit 1
          fi
          cd "$RUNNER_TEMP"
          curl -fsSL -o pg.tar.bz2 "$url"
          echo "$sha  pg.tar.bz2" | sha256sum -c
          mkdir src
          tar xjf pg.tar.bz2 -C src --strip-components=1
      # The minimal configuration from configs/minimal.toml, without the TAP tests, which this
      # check does not need. CC_LD is how meson is told which linker gcc should call. rucc is
      # given MSYS2's UCRT64 tree as its sysroot, so it uses the same headers and libraries as gcc.
      - name: meson setup
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          if [ "${{ matrix.cc }}" = rucc ]; then
            export CC="$RUCC --target=x86_64-windows-gnu --sysroot=$(cygpath -m /ucrt64)"
          else
            export CC=gcc CC_LD=${{ matrix.linker }}
          fi
          meson setup build src \
            -Dauto_features=disabled -Dicu=disabled -Dreadline=disabled -Dzlib=disabled \
            -Dssl=none -Dnls=disabled -Dlz4=disabled -Dzstd=disabled -Dlibxml=disabled \
            -Dllvm=disabled -Duuid=none -Dtap_tests=disabled -Dcassert=false -Ddebug=true \
            -Doptimization=2 | tee setup.txt
          if ! grep -q "C linker for the host machine: .* ld.${{ matrix.linker }}" setup.txt; then
            echo "::error::meson did not pick ld.${{ matrix.linker }}"
            exit 1
          fi
      - name: build
        run: ninja -C "$RUNNER_TEMP/build"
      - name: regression suite
        run: |
          set -o pipefail
          meson test -C "$RUNNER_TEMP/build" --suite setup --suite regress --print-errorlogs \
            | tee "$RUNNER_TEMP/regress.txt"
      - name: summary
        if: always()
        run: |
          {
            echo "### $PIN built by ${{ matrix.cc }} and linked by ld.${{ matrix.linker }} on W64"
            echo
            grep -E '^(Ok|Fail|Skipped|Timeout|Expected Fail|Unexpected Pass):' "$RUNNER_TEMP/regress.txt" \
              || echo "the regression suite did not get as far as a count"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: keep the run
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: w64-${{ matrix.cc }}-${{ matrix.linker }}-${{ env.PIN }}
          path: |
            ${{ runner.temp }}/setup.txt
            ${{ runner.temp }}/regress.txt
            ${{ runner.temp }}/build/meson-logs/
            ${{ runner.temp }}/build/testrun/regress/
          if-no-files-found: ignore

  rpg:
    name: rpg build and the world suite on W64 with rucc
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 240
    env:
      RUCC_VERSION: ${{ inputs.rucc || '0.19.0' }}
      PIN: ${{ inputs.pin || 'REL_18_6' }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      # Cargo is on the runner's own PATH and not MSYS2's, so rpg is built outside it.
      - name: build rpg
        shell: pwsh
        run: cargo build --release --workspace
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-perl
            mingw-w64-ucrt-x86_64-make
            make
            bison
            flex
            diffutils
            tar
            bzip2
            unzip
            jq
      - name: install rucc
        run: |
          set -euo pipefail
          name="rucc-v$RUCC_VERSION-x86_64-pc-windows-msvc"
          cd "$RUNNER_TEMP"
          base="https://github.com/tamnd/rucc/releases/download/v$RUCC_VERSION"
          curl -fsSLO "$base/$name.zip"
          curl -fsSLO "$base/$name.zip.sha256"
          sha256sum -c "$name.zip.sha256"
          unzip -q "$name.zip"
          cc="$(cygpath -m "$RUNNER_TEMP/$name/rucc.exe") --target=x86_64-windows-gnu"
          cc="$cc --sysroot=$(cygpath -m /ucrt64)"
          echo "RUCC_CC=$cc" >> "$GITHUB_ENV"
      # Meson sets up the TAP tests only when Perl has IPC::Run, which MSYS2 does not package, so it
      # goes into a local lib as on M64. On Windows it needs Win32::Process, which cpanm builds with
      # make. The path is a Windows one, since this Perl is a native program.
      - name: install IPC::Run
        run: |
          set -euo pipefail
          lib="$(cygpath -m "$HOME/perl5")"
          curl -fsSL https://cpanmin.us | perl - --notest --local-lib="$lib" IPC::Run
          echo "PERL5LIB=$lib/lib/perl5" >> "$GITHUB_ENV"
      # rpg runs tar by name, and on Windows that finds the bsdtar in System32 before MSYS2's, which
      # sat on this archive until the step timed out. MSYS2's curl and tar fill rpg's cache instead,
      # and rpg fetch checks the hash and finds the tree already unpacked.
      - name: rpg fetch
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cache="$(cygpath -m "$RUNNER_TEMP/rpg-cache")"
          echo "RPG_CACHE=$cache" >> "$GITHUB_ENV"
          export RPG_CACHE="$cache"
          url=$(sed -n "/^name = \"$PIN\"/,/^\$/s/^url = \"\(.*\)\"/\1/p" pins.toml)
          unix="$(cygpath -u "$RUNNER_TEMP/rpg-cache")"
          mkdir -p "$unix/archives" "$unix/src/$PIN"
          curl -fsSL --max-time 600 -o "$unix/archives/${url##*/}" "$url"
          tar -xf "$unix/archives/${url##*/}" -C "$unix/src/$PIN" --strip-components=1
          ./target/release/rpg.exe fetch --pin "$PIN" --no-upstream-check
      - name: rpg build
        timeout-minutes: 90
        run: |
          ./target/release/rpg.exe build --pin "$PIN" --cc "$RUCC_CC" --level -O2 --system meson \
            --config minimal --out "$(cygpath -m "$RUNNER_TEMP/pg")" --jobs "$(nproc)"
      - name: rpg test --suite world
        timeout-minutes: 120
        run: |
          set -o pipefail
          ./target/release/rpg.exe test --suite world --row W64 --out "$(cygpath -m "$RUNNER_TEMP/pg")" \
            | tee "$RUNNER_TEMP/world.txt"
      - name: summary
        if: always()
        run: |
          {
            echo "### $PIN world on W64 under meson at -O2 through rpg, with rucc $RUCC_VERSION"
            echo
            grep '^world:' "$RUNNER_TEMP/world.txt" || echo "rpg test did not get as far as a count"
            echo
            echo "Everything that did not pass:"
            echo
            jq -r 'select(.outcome != "passed" and .outcome != "skipped") | "- \(.test) \(.outcome)"' \
              "$RUNNER_TEMP/pg/records.jsonl" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: keep the run
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: rpg-w64-world-${{ env.PIN }}-meson-O2
          path: |
            ${{ runner.temp }}/pg/build.json
            ${{ runner.temp }}/pg/records.jsonl
            ${{ runner.temp }}/pg/compile.jsonl
            ${{ runner.temp }}/pg/configure.log
            ${{ runner.temp }}/pg/build.log
            ${{ runner.temp }}/pg/build/meson-logs/
            ${{ runner.temp }}/pg/results/
          if-no-files-found: ignore
