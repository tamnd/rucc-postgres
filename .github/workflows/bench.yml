# PG7's numbers: rpg bench against a gcc build and a rucc build of the same pin at -O2, one after
# the other on one runner, and rpg bench-compare between them in the job summary, then rpg profile
# on both servers and rpg profile-compare to say where the difference goes. A shared runner
# is a noisy machine, so these numbers say which way things are going rather than whether the
# exit criterion holds, which is measured on server3. It runs each night at 5 runs of 30 seconds,
# by hand at the full sizes, and at small sizes on the pull requests that change how the measures
# are taken. After a night's run, rpg bench-night keeps how many times as long the rucc server took
# as the gcc one in runs/bench/, rewrites reports/bench.md, commits both to main, and opens an
# issue labeled kind/perf when a measure got worse since the night before. The issue goes to
# tamnd/rucc when the RUCC_ISSUES secret holds a token that can open issues there, and to this
# repository otherwise, as the nightly workflow's does.
name: bench

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      rucc:
        description: rucc release to build with
        default: "0.24.8"
      pin:
        description: pin from pins.toml, a release or a branch
        default: REL_18_6
      runs:
        description: how many times each measure is taken
        default: "10"
  pull_request:
    paths:
      - .github/workflows/bench.yml
      - crates/rpg/src/bench.rs
      - crates/rpg/src/analytic.rs
      - crates/rpg/src/analytic/**
      - crates/rpg/src/profile.rs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  bench:
    name: bench gcc against rucc at -O2
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      RUCC_VERSION: ${{ inputs.rucc || '0.24.8' }}
      PIN: ${{ inputs.pin || 'REL_18_6' }}
      # A pull request only checks that every measure runs, so it takes small sizes.
      SIZES: ${{ github.event_name == 'pull_request' && '--runs 3 --seconds 20 --scale 10 --sf 0.1' || github.event_name == 'schedule' && '--runs 5 --seconds 30' || format('--runs {0}', inputs.runs || '10') }}
      PROFILE_SIZES: ${{ github.event_name == 'pull_request' && '--transactions 2000 --scale 10 --sf 0.1' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: install what configure checks for
        run: |
          sudo apt-get update || echo "at least one apt source is unhappy, carrying on"
          sudo apt-get install -y libipc-run-perl
      - name: install perf
        run: |
          sudo apt-get install -y linux-tools-common "linux-tools-$(uname -r)"
          # Ubuntu keeps perf from users entirely, and rpg profile only asks for its own processes.
          sudo sysctl -w kernel.perf_event_paranoid=1
          perf --version
      - name: install rucc
        run: |
          set -euo pipefail
          name="rucc-v$RUCC_VERSION-x86_64-unknown-linux-gnu"
          cd "$RUNNER_TEMP"
          base="https://github.com/tamnd/rucc/releases/download/v$RUCC_VERSION"
          curl -fsSLO "$base/$name.tar.gz"
          curl -fsSLO "$base/$name.tar.gz.sha256"
          sha256sum -c "$name.tar.gz.sha256"
          tar xzf "$name.tar.gz"
          echo "RUCC=$RUNNER_TEMP/$name/rucc" >> "$GITHUB_ENV"
      - name: rpg fetch
        run: |
          cargo build --release --workspace
          ./target/release/rpg fetch --pin "$PIN" --no-upstream-check
      - name: build with gcc and with rucc
        run: |
          for cc in gcc "$RUCC"; do
            name=$(basename "$cc")
            ./target/release/rpg build --pin "$PIN" --cc "$cc" --level -O2 --system autoconf --config minimal \
              --out "$RUNNER_TEMP/$name" --jobs "$(nproc)"
          done
      - name: bench the gcc server
        run: ./target/release/rpg bench --out "$RUNNER_TEMP/gcc" $SIZES
      - name: bench the rucc server
        if: ${{ !cancelled() }}
        run: ./target/release/rpg bench --out "$RUNNER_TEMP/rucc" $SIZES
      - name: compare
        if: ${{ !cancelled() }}
        run: |
          ./target/release/rpg bench-compare --a "$RUNNER_TEMP/gcc" --b "$RUNNER_TEMP/rucc" \
            --out "$RUNNER_TEMP/compare.md"
          cat "$RUNNER_TEMP/compare.md" >> "$GITHUB_STEP_SUMMARY"
      - name: profile the gcc server
        if: ${{ !cancelled() }}
        run: ./target/release/rpg profile --out "$RUNNER_TEMP/gcc" $PROFILE_SIZES
      - name: profile the rucc server
        if: ${{ !cancelled() }}
        run: ./target/release/rpg profile --out "$RUNNER_TEMP/rucc" $PROFILE_SIZES
      - name: compare the profiles
        if: ${{ !cancelled() }}
        run: |
          ./target/release/rpg profile-compare --a "$RUNNER_TEMP/gcc" --b "$RUNNER_TEMP/rucc" \
            --out "$RUNNER_TEMP/profile.md"
          cat "$RUNNER_TEMP/profile.md" >> "$GITHUB_STEP_SUMMARY"
      - name: keep the runs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: rpg-bench-${{ env.PIN }}-O2
          path: |
            ${{ runner.temp }}/compare.md
            ${{ runner.temp }}/profile.md
            ${{ runner.temp }}/gcc/profile/profile.json
            ${{ runner.temp }}/rucc/profile/profile.json
            ${{ runner.temp }}/gcc/bench/
            ${{ runner.temp }}/gcc/records.jsonl
            ${{ runner.temp }}/rucc/bench/
            ${{ runner.temp }}/rucc/records.jsonl
          if-no-files-found: ignore

  record:
    name: record the night
    needs: bench
    if: ${{ github.event_name == 'schedule' && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo build --release -p rpg
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: rpg-bench-*
          merge-multiple: true
          path: ${{ runner.temp }}/night
      - name: rpg bench-night
        run: |
          ./target/release/rpg bench-night --gcc "$RUNNER_TEMP/night/gcc" --rucc "$RUNNER_TEMP/night/rucc" \
            --issue "$RUNNER_TEMP/issue.md" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            | tee "$RUNNER_TEMP/night.txt"
          {
            echo "### The night"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/night.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: commit the night
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/bench reports/bench.md
          if git diff --cached --quiet; then
            echo "nothing new to keep"
            exit 0
          fi
          git commit -q -m "Record the bench of $(date -u +%F)"
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((attempt * 10))
          done
          exit 1
      - name: open an issue for a regression
        env:
          RUCC_ISSUES: ${{ secrets.RUCC_ISSUES }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f "$RUNNER_TEMP/issue.md" ] || { echo "nothing got worse"; exit 0; }
          head -n 1 "$RUNNER_TEMP/issue.md" > "$RUNNER_TEMP/title.txt"
          tail -n +2 "$RUNNER_TEMP/issue.md" > "$RUNNER_TEMP/body.md"
          if [ -n "$RUCC_ISSUES" ]; then
            GH_TOKEN="$RUCC_ISSUES" gh issue create -R tamnd/rucc --title "$(cat "$RUNNER_TEMP/title.txt")" \
              --body-file "$RUNNER_TEMP/body.md" --label kind/perf
          else
            GH_TOKEN="$GITHUB_TOKEN" gh issue create -R "$GITHUB_REPOSITORY" --title "$(cat "$RUNNER_TEMP/title.txt")" \
              --body-file "$RUNNER_TEMP/body.md" --label kind/perf
          fi
