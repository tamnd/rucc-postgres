# PG3's suites: `make check-world` under autoconf and every suite but setup under meson, TAP
# included, on Postgres built by a released rucc at -O0 and -O2 with the minimal configuration and
# the PG_TEST_EXTRA the exit criterion names. They take too long for every pull request, so they
# run each night on the default pin, each Monday on the head of REL_19_STABLE, by hand, and on the
# pull requests that change how the suites run or are read. By hand, `rows: M64` runs the macOS
# row alone and `rows: W64` the Windows one. L64 also runs under autoconf at -O1 and -Os, the levels PG8 adds, at -O2 with -flto
# under both build systems, and at -O2 with the full configuration under both build systems.
name: world

on:
  schedule:
    - cron: "17 3 * * *"
    # Mondays, the same suites on the head of REL_19_STABLE.
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      rucc:
        description: rucc release to build with
        default: "0.20.0"
      pin:
        description: pin from pins.toml, a release or a branch
        default: REL_18_6
      rows:
        description: every job, or only the M64 or the W64 row
        type: choice
        options: [all, M64, W64]
        default: all
  pull_request:
    paths:
      - .github/workflows/world.yml
      - crates/rpg/src/suite.rs
      - crates/rpg/src/settings.rs
      - crates/rpg/src/regress.rs
      - crates/rpg/src/pins.rs
      - crates/rpg/src/cross.rs
      - crates/rpg/src/stress.rs
      - crates/rpg/src/triage.rs
      - crates/rpg/src/mixed.rs
      - crates/rpg/src/configdiff.rs
      - crates/rpg/src/frames.rs
      - config-divergences.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # LA64 runs on GitHub's arm runners under autoconf only, which is PG4's row brought forward so
  # that what AArch64 is missing shows up before that milestone starts.
  world:
    name: world on ${{ matrix.row }} under ${{ matrix.system }} at ${{ matrix.level }}${{ matrix.config == 'full' && ' with the full configuration' || '' }}
    if: inputs.rows != 'M64' && inputs.rows != 'W64'
    runs-on: ${{ matrix.row == 'LA64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        row: [L64]
        level: [-O0, -O2]
        system: [autoconf, meson]
        config: [minimal]
        include:
          - row: LA64
            level: -O0
            system: autoconf
          - row: LA64
            level: -O2
            system: autoconf
          # PG8's two extra levels, on L64 under autoconf. They are not graded yet; this is how
          # what they break shows up before they are.
          - row: L64
            level: -O1
            system: autoconf
          - row: L64
            level: -Os
            system: autoconf
          # And -O2 with -flto on every compile and link, under both build systems, since meson
          # asks for it with b_lto and autoconf with CFLAGS and LDFLAGS.
          - row: L64
            level: -O2-flto
            system: autoconf
          - row: L64
            level: -O2-flto
            system: meson
          # PG8's full configuration, every library the milestone names, on L64 at -O2 under both
          # build systems. Each library comes from the distribution, built by gcc, so this is also
          # the ABI between the two compilers at work.
          - row: L64
            level: -O2
            system: autoconf
            config: full
          - row: L64
            level: -O2
            system: meson
            config: full
          # And on LA64, where the libraries are aarch64 builds from the same distribution, so the
          # ABI that meets them is the other one rucc speaks.
          - row: LA64
            level: -O2
            system: autoconf
            config: full
    timeout-minutes: 240
    env:
      RUCC_VERSION: ${{ inputs.rucc || '0.20.0' }}
      PIN: ${{ github.event.schedule == '41 4 * * 1' && 'REL_19_STABLE' || inputs.pin || 'REL_18_6' }}
      PG_TEST_EXTRA: wal_consistency_checking regress_dump_restore xid_wraparound
      # pg_ctl gives a server 60 seconds to stop by default, and the xid_wraparound tests leave a
      # shutdown checkpoint that can take longer on a busy runner. This is the TAP harness's own
      # default for every other wait.
      PGCTLTIMEOUT: 180
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: install what the tap tests and the build need
        run: |
          sudo apt-get update || echo "at least one apt source is unhappy, carrying on"
          sudo apt-get install -y libipc-run-perl meson ninja-build bison flex gdb
      - name: install the libraries the full configuration links
        if: matrix.config == 'full'
        run: |
          sudo apt-get install -y libssl-dev libicu-dev libreadline-dev zlib1g-dev liblz4-dev libzstd-dev \
            libxml2-dev libxslt1-dev pkg-config
      - name: install rucc
        run: |
          set -euo pipefail
          name="rucc-v$RUCC_VERSION-$(uname -m)-unknown-linux-gnu"
          cd "$RUNNER_TEMP"
          base="https://github.com/tamnd/rucc/releases/download/v$RUCC_VERSION"
          curl -fsSLO "$base/$name.tar.gz"
          curl -fsSLO "$base/$name.tar.gz.sha256"
          sha256sum -c "$name.tar.gz.sha256"
          tar xzf "$name.tar.gz"
          echo "RUCC=$RUNNER_TEMP/$name/rucc" >> "$GITHUB_ENV"
      - name: rpg fetch
        run: |
          cargo build --release --workspace
          ./target/release/rpg fetch --pin "$PIN" --no-upstream-check
      - name: rpg build
        run: |
          ./target/release/rpg build --pin "$PIN" --cc "$RUCC" --level ${{ matrix.level }} --system ${{ matrix.system }} --config ${{ matrix.config || 'minimal' }} \
            --out "$RUNNER_TEMP/pg" --jobs "$(nproc)"
      # What rpg triage reads afterwards: a core from any process that crashes, named with the
      # path of its executable so gdb can be given both, and server logs at debug1, which
      # TEMP_CONFIG reaches under autoconf and in every TAP script.
      - name: keep cores and debug1 server logs
        run: |
          mkdir -p "$RUNNER_TEMP/pg/cores"
          sudo sysctl -w kernel.core_pattern="$RUNNER_TEMP/pg/cores/core.%E.%p"
          echo "log_min_messages = debug1" > "$RUNNER_TEMP/debug1.conf"
          echo "TEMP_CONFIG=$RUNNER_TEMP/debug1.conf" >> "$GITHUB_ENV"
      - name: rpg test --suite world
        run: |
          set -o pipefail
          ulimit -c unlimited
          ./target/release/rpg test --suite world --row ${{ matrix.row }} --out "$RUNNER_TEMP/pg" | tee "$RUNNER_TEMP/world.txt"
      - name: rpg triage
        if: always()
        run: ./target/release/rpg triage --out "$RUNNER_TEMP/pg"
      - name: summary
        if: always()
        run: |
          {
            echo "### $PIN world on ${{ matrix.row }} under ${{ matrix.system }} at ${{ matrix.level }} with the ${{ matrix.config || 'minimal' }} configuration and rucc $RUCC_VERSION"
            echo
            grep '^world:' "$RUNNER_TEMP/world.txt" || echo "rpg test did not get as far as a count"
            echo
            echo "Everything that did not pass:"
            echo
            jq -r 'select(.outcome != "passed" and .outcome != "skipped") | "- \(.test) \(.outcome)"' \
              "$RUNNER_TEMP/pg/records.jsonl" 2>/dev/null || true
            echo
            sed 's/^# Triage$/#### Triage/; s/^## /##### /' "$RUNNER_TEMP/pg/triage.md" 2>/dev/null | head -200 || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: keep the run
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: rpg-world-${{ matrix.row }}-${{ env.PIN }}-${{ matrix.system }}${{ matrix.level }}${{ matrix.config == 'full' && '-full' || '' }}
          path: |
            ${{ runner.temp }}/pg/results/
            ${{ runner.temp }}/pg/triage.md
            ${{ runner.temp }}/pg/triage/
            ${{ runner.temp }}/pg/records.jsonl
            ${{ runner.temp }}/pg/build.json
            ${{ runner.temp }}/pg/test-world-run.log
            ${{ runner.temp }}/pg/build.log
            ${{ runner.temp }}/pg/build/meson-logs/testlog.json
          if-no-files-found: ignore

  # M64, PG5's row: macOS arm64 under autoconf and meson, graded against Apple Clang, with crash
  # reports from ~/Library/Logs/DiagnosticReports in place of cores. It runs each night and by
  # hand, not on pull requests, since macOS runners are slow to come by. PG8's full configuration
  # runs at -O2 under autoconf with Homebrew's libraries.
  world-m64:
    name: world on M64 under ${{ matrix.system }} at ${{ matrix.level }}${{ matrix.config == 'full' && ' with the full configuration' || '' }}
    if: github.event_name != 'pull_request' && inputs.rows != 'W64'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        level: [-O0, -O2]
        system: [autoconf, meson]
        config: [minimal]
        include:
          - level: -O2
            system: autoconf
            config: full
    timeout-minutes: 240
    env:
      RUCC_VERSION: ${{ inputs.rucc || '0.20.0' }}
      PIN: ${{ github.event.schedule == '41 4 * * 1' && 'REL_19_STABLE' || inputs.pin || 'REL_18_6' }}
      PG_TEST_EXTRA: wal_consistency_checking regress_dump_restore xid_wraparound
      # pg_ctl gives a server 60 seconds to stop by default, and the xid_wraparound tests leave a
      # shutdown checkpoint that can take longer on a busy runner. This is the TAP harness's own
      # default for every other wait.
      PGCTLTIMEOUT: 180
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      # Homebrew's bison and flex, as upstream's CI uses, which are keg only and so go on the
      # path by hand. GNU make 4 as gmake, since the system's 3.81 has no -O, and meson with
      # ninja. IPC::Run for the TAP tests into a local lib for the perl configure finds.
      - name: install what the tap tests and the build need
        run: |
          set -euo pipefail
          brew install bison flex make meson ninja
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          curl -fsSL https://cpanmin.us | perl - --notest --local-lib="$HOME/perl5" IPC::Run
          echo "PERL5LIB=$HOME/perl5/lib/perl5" >> "$GITHUB_ENV"
          echo "JOBS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
          xcrun --show-sdk-path
          clang --version | head -1
      - name: install the libraries the full configuration links
        if: matrix.config == 'full'
        run: |
          set -euo pipefail
          formulae="openssl@3 icu4c lz4 zstd libxml2 libxslt readline pkgconf"
          brew install $formulae
          # Several of these are keg-only, so neither the compiler nor pkg-config looks where they are.
          prefixes="$(brew --prefix)"
          for f in $formulae; do prefixes="$prefixes:$(brew --prefix "$f")"; done
          echo "RPG_PREFIXES=$prefixes" >> "$GITHUB_ENV"
      - name: install rucc
        run: |
          set -euo pipefail
          name="rucc-v$RUCC_VERSION-aarch64-apple-darwin"
          cd "$RUNNER_TEMP"
          base="https://github.com/tamnd/rucc/releases/download/v$RUCC_VERSION"
          curl -fsSLO "$base/$name.tar.gz"
          curl -fsSLO "$base/$name.tar.gz.sha256"
          shasum -a 256 -c "$name.tar.gz.sha256"
          tar xzf "$name.tar.gz"
          echo "RUCC=$RUNNER_TEMP/$name/rucc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/$name/rucc" --version
      - name: rpg fetch
        run: |
          cargo build --release --workspace
          ./target/release/rpg fetch --pin "$PIN" --no-upstream-check
      - name: rpg build
        run: |
          ./target/release/rpg build --pin "$PIN" --cc "$RUCC" --level ${{ matrix.level }} --system ${{ matrix.system }} --config ${{ matrix.config }} \
            --out "$RUNNER_TEMP/pg" --jobs "$JOBS"
      # macOS writes a crash report rather than a core, which rpg triage reads from
      # ~/Library/Logs/DiagnosticReports, so only the debug1 server logs need setting up.
      - name: keep debug1 server logs
        run: |
          echo "log_min_messages = debug1" > "$RUNNER_TEMP/debug1.conf"
          echo "TEMP_CONFIG=$RUNNER_TEMP/debug1.conf" >> "$GITHUB_ENV"
      # The open file limit is 256 by default, which upstream's CI raises to 1024 for macOS.
      - name: rpg test --suite world
        run: |
          set -o pipefail
          ulimit -n 1024
          ./target/release/rpg test --suite world --row M64 --out "$RUNNER_TEMP/pg" | tee "$RUNNER_TEMP/world.txt"
      - name: rpg triage
        if: always()
        run: ./target/release/rpg triage --out "$RUNNER_TEMP/pg"
      - name: summary
        if: always()
        run: |
          {
            echo "### $PIN world on M64 under ${{ matrix.system }} at ${{ matrix.level }} with the ${{ matrix.config }} configuration and rucc $RUCC_VERSION"
            echo
            jq -r '"build: \(.phase)" + (if .["first-error"] then ", \(.["first-error"])" else "" end)' \
              "$RUNNER_TEMP/pg/build.json" 2>/dev/null || echo "rpg build did not write build.json"
            echo
            grep '^world:' "$RUNNER_TEMP/world.txt" 2>/dev/null || echo "rpg test did not get as far as a count"
            echo
            echo "Everything that did not pass:"
            echo
            jq -r 'select(.outcome != "passed" and .outcome != "skipped") | "- \(.test) \(.outcome)"' \
              "$RUNNER_TEMP/pg/records.jsonl" 2>/dev/null || true
            echo
            sed 's/^# Triage$/#### Triage/; s/^## /##### /' "$RUNNER_TEMP/pg/triage.md" 2>/dev/null | head -200 || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: keep the run
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: rpg-world-M64-${{ env.PIN }}-${{ matrix.system }}${{ matrix.level }}${{ matrix.config == 'full' && '-full' || '' }}
          path: |
            ${{ runner.temp }}/pg/results/
            ${{ runner.temp }}/pg/triage.md
            ${{ runner.temp }}/pg/triage/
            ${{ runner.temp }}/pg/records.jsonl
            ${{ runner.temp }}/pg/build.json
            ${{ runner.temp }}/pg/test-world-run.log
            ${{ runner.temp }}/pg/build.log
            ${{ runner.temp }}/pg/configure.log
            ${{ runner.temp }}/pg/build/meson-logs/testlog.json
          if-no-files-found: ignore

  # W64, PG6's row: Windows x86-64 in MSYS2's UCRT64 environment under meson only, graded against
  # MSYS2's gcc. The setup is the windows workflow's: IPC::Run before its Win32 binmode change, Unix
  # sockets for the TAP tests with their directory under the runner's temp directory, and Windows's
  # own tar for the tests that unpack a base backup. Like M64 it runs each night and by hand, not on
  # pull requests.
  world-w64:
    name: world on W64 under meson at ${{ matrix.level }}
    if: github.event_name != 'pull_request' && inputs.rows != 'M64'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        level: [-O0, -O2]
    timeout-minutes: 330
    env:
      RUCC_VERSION: ${{ inputs.rucc || '0.20.0' }}
      PIN: ${{ github.event.schedule == '41 4 * * 1' && 'REL_19_STABLE' || inputs.pin || 'REL_18_6' }}
      PG_TEST_EXTRA: wal_consistency_checking regress_dump_restore xid_wraparound
      PGCTLTIMEOUT: 180
      PG_TEST_USE_UNIX_SOCKETS: 1
      MSYS: winjitdebug
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: build rpg
        shell: pwsh
        run: cargo build --release --workspace
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-perl
            mingw-w64-ucrt-x86_64-make
            make
            bison
            flex
            diffutils
            tar
            bzip2
            unzip
            jq
            git
      - name: install rucc
        run: |
          set -euo pipefail
          name="rucc-v$RUCC_VERSION-x86_64-pc-windows-msvc"
          cd "$RUNNER_TEMP"
          base="https://github.com/tamnd/rucc/releases/download/v$RUCC_VERSION"
          curl -fsSLO "$base/$name.zip"
          curl -fsSLO "$base/$name.zip.sha256"
          sha256sum -c "$name.zip.sha256"
          unzip -q "$name.zip"
          cc="$(cygpath -m "$RUNNER_TEMP/$name/rucc.exe") --target=x86_64-windows-gnu"
          echo "RUCC=$cc --sysroot=$(cygpath -m /ucrt64)" >> "$GITHUB_ENV"
      - name: install IPC::Run
        run: |
          set -euo pipefail
          lib="$(cygpath -m "$HOME/perl5")"
          curl -fsSL https://cpanmin.us | perl - --notest --local-lib="$lib" IPC::Run@20231003.0
          echo "PERL5LIB=$lib/lib/perl5" >> "$GITHUB_ENV"
      # MSYS2's curl and tar fill rpg's cache, since the bsdtar in System32 that rpg would find
      # first is slow on this archive, and rpg fetch checks the hash. A branch pin is cloned by rpg.
      - name: rpg fetch
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cache="$(cygpath -m "$RUNNER_TEMP/rpg-cache")"
          echo "RPG_CACHE=$cache" >> "$GITHUB_ENV"
          export RPG_CACHE="$cache"
          url=$(sed -n "/^name = \"$PIN\"/,/^\$/s/^url = \"\(.*\)\"/\1/p" pins.toml)
          if [ -n "$url" ]; then
            unix="$(cygpath -u "$RUNNER_TEMP/rpg-cache")"
            mkdir -p "$unix/archives" "$unix/src/$PIN"
            curl -fsSL --max-time 600 -o "$unix/archives/${url##*/}" "$url"
            tar -xf "$unix/archives/${url##*/}" -C "$unix/src/$PIN" --strip-components=1
          fi
          ./target/release/rpg.exe fetch --pin "$PIN" --no-upstream-check
      - name: rpg build
        timeout-minutes: 90
        run: |
          mkdir -p "$RUNNER_TEMP/wintar"
          cp /c/Windows/System32/tar.exe "$RUNNER_TEMP/wintar/"
          PATH="$RUNNER_TEMP/wintar:$PATH" \
          ./target/release/rpg.exe build --pin "$PIN" --cc "$RUCC" --level ${{ matrix.level }} --system meson \
            --config minimal --out "$(cygpath -m "$RUNNER_TEMP/pg")" --jobs "$(nproc)"
      # Windows Error Reporting writes a minidump of any postgres.exe that crashes from outside the
      # process, whole even when the one Postgres writes of itself is not, into results/ for rpg triage.
      - name: windows error reporting
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\postgres.exe"
          $dir = "$env:RUNNER_TEMP\pg\results\windows-error-reporting"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dir -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 20 -Force | Out-Null
      - name: rpg test --suite world
        timeout-minutes: 220
        run: |
          set -o pipefail
          export PG_REGRESS_SOCK_DIR="$(cygpath -m "$RUNNER_TEMP")/"
          ./target/release/rpg.exe test --suite world --row W64 --out "$(cygpath -m "$RUNNER_TEMP/pg")" \
            | tee "$RUNNER_TEMP/world.txt"
      # The minidumps rpg test kept and Windows wrote, read by the cdb the runner image has from the
      # Windows SDK.
      - name: rpg triage
        if: always()
        run: ./target/release/rpg.exe triage --out "$(cygpath -m "$RUNNER_TEMP/pg")"
      - name: summary
        if: always()
        run: |
          {
            echo "### $PIN world on W64 under meson at ${{ matrix.level }} with the minimal configuration and rucc $RUCC_VERSION"
            echo
            jq -r '"build: \(.phase)" + (if .["first-error"] then ", \(.["first-error"])" else "" end)' \
              "$RUNNER_TEMP/pg/build.json" 2>/dev/null || echo "rpg build did not write build.json"
            echo
            grep '^world:' "$RUNNER_TEMP/world.txt" 2>/dev/null || echo "rpg test did not get as far as a count"
            echo
            echo "Everything that did not pass:"
            echo
            jq -r 'select(.outcome != "passed" and .outcome != "skipped") | "- \(.test) \(.outcome)"' \
              "$RUNNER_TEMP/pg/records.jsonl" 2>/dev/null || true
            echo
            sed 's/^# Triage$/#### Triage/; s/^## /##### /' "$RUNNER_TEMP/pg/triage.md" 2>/dev/null | head -200 || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: keep the run
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: rpg-world-W64-${{ env.PIN }}-meson${{ matrix.level }}
          path: |
            ${{ runner.temp }}/pg/results/
            ${{ runner.temp }}/pg/triage.md
            ${{ runner.temp }}/pg/triage/
            ${{ runner.temp }}/pg/records.jsonl
            ${{ runner.temp }}/pg/build.json
            ${{ runner.temp }}/pg/test-world-*.log
            ${{ runner.temp }}/pg/build.log
            ${{ runner.temp }}/pg/configure.log
            ${{ runner.temp }}/pg/build/meson-logs/testlog.json
          if-no-files-found: ignore

  # PG3's fourth criterion: every object is the same when compiled twice, and two builds in
  # different directories give the same postgres binary once the debug information, which holds
  # the paths, is stripped.
  reproducible:
    name: reproducible at ${{ matrix.level }}
    if: inputs.rows != 'M64' && inputs.rows != 'W64'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        level: [-O0, -O2]
    timeout-minutes: 60
    env:
      RUCC_VERSION: ${{ inputs.rucc || '0.20.0' }}
      PIN: ${{ github.event.schedule == '41 4 * * 1' && 'REL_19_STABLE' || inputs.pin || 'REL_18_6' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: install what configure checks for
        run: |
          sudo apt-get update || echo "at least one apt source is unhappy, carrying on"
          sudo apt-get install -y libipc-run-perl
      - name: install rucc
        run: |
          set -euo pipefail
          name="rucc-v$RUCC_VERSION-x86_64-unknown-linux-gnu"
          cd "$RUNNER_TEMP"
          base="https://github.com/tamnd/rucc/releases/download/v$RUCC_VERSION"
          curl -fsSLO "$base/$name.tar.gz"
          curl -fsSLO "$base/$name.tar.gz.sha256"
          sha256sum -c "$name.tar.gz.sha256"
          tar xzf "$name.tar.gz"
          echo "RUCC=$RUNNER_TEMP/$name/rucc" >> "$GITHUB_ENV"
      - name: rpg fetch
        run: |
          cargo build --release --workspace
          ./target/release/rpg fetch --pin "$PIN" --no-upstream-check
      - name: build with every object compiled twice
        run: |
          ./target/release/rpg build --pin "$PIN" --cc "$RUCC" --level ${{ matrix.level }} --system autoconf --config minimal \
            --out "$RUNNER_TEMP/a-pg" --jobs "$(nproc)" --twice | tee "$RUNNER_TEMP/twice.txt"
          grep -q '^twice: *0 ' "$RUNNER_TEMP/twice.txt"
      - name: build again somewhere else
        run: |
          ./target/release/rpg build --pin "$PIN" --cc "$RUCC" --level ${{ matrix.level }} --system autoconf --config minimal \
            --out "$RUNNER_TEMP/b-pg" --jobs "$(nproc)"
      # pg_config's answers, the configure arguments and CC among them, are compiled into
      # postgres and pg_config, and CC is the shim inside each build's directory. The two
      # directories have names of the same length, so the one name can stand in for the other
      # before the bytes are compared. Every object has to be the same after that. A linked
      # binary can still differ, because those strings go where the linker merges strings and ld
      # places merged strings by their contents, so a string holding the path moves when the path
      # does. Such a binary passes when its sections have the same sizes and it holds the same
      # strings, and it is named in the summary.
      - name: compare the objects and the binaries
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          swap() { python3 -c 'import sys; p=sys.argv[1]; d=open(p,"rb").read(); open(p,"wb").write(d.replace(b"/a-pg/", b"/b-pg/"))' "$1"; }
          objects=0
          for a in $(cd a-pg/build && find src contrib -name '*.o' | sort); do
            b="b-pg/build/$a"
            [ -f "$b" ] || continue
            strip --strip-debug -o one "a-pg/build/$a"
            strip --strip-debug -o two "$b"
            swap one
            if ! cmp -s one two; then
              echo "object differs: $a"
              objects=$((objects + 1))
            fi
          done
          different=0
          placed=""
          for a in $(cd a-pg/build && find src contrib -name '*.so' -o -type f -perm -u+x -name 'pg*' -o -type f -name postgres | sort); do
            b="b-pg/build/$a"
            [ -f "$b" ] || continue
            # Scripts are named pg* too, and strip refuses anything that is not an object.
            strip --strip-debug -o one "a-pg/build/$a" 2>/dev/null || continue
            strip --strip-debug -o two "$b"
            swap one
            cmp -s one two && continue
            if [ "$(size -A one | tail -n +3)" = "$(size -A two | tail -n +3)" ] \
              && cmp -s <(strings -n 6 one | sort) <(strings -n 6 two | sort); then
              placed="$placed $a"
              continue
            fi
            echo "differs: $a"
            diff <(strings -n 6 one) <(strings -n 6 two) | head -20 || true
            different=$((different + 1))
          done
          {
            echo "$objects objects differ, $different binaries differ"
            [ -z "$placed" ] || echo "the same apart from where the linker put merged strings:$placed"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$objects" = 0 ] && [ "$different" = 0 ]

  # PG3's third criterion: the modules built by rucc loaded into a server built by gcc, and the
  # other way round, on L64 and, for PG8's, on LA64 too.
  cross-modules:
    name: cross-modules on ${{ matrix.row }} at ${{ matrix.level }}
    if: inputs.rows != 'M64' && inputs.rows != 'W64'
    runs-on: ${{ matrix.row == 'LA64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        row: [L64, LA64]
        level: [-O0, -O2]
    timeout-minutes: 90
    env:
      RUCC_VERSION: ${{ inputs.rucc || '0.20.0' }}
      PIN: ${{ github.event.schedule == '41 4 * * 1' && 'REL_19_STABLE' || inputs.pin || 'REL_18_6' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: install what the tap tests and the build need
        run: |
          sudo apt-get update || echo "at least one apt source is unhappy, carrying on"
          sudo apt-get install -y libipc-run-perl
      - name: install rucc
        run: |
          set -euo pipefail
          name="rucc-v$RUCC_VERSION-$(uname -m)-unknown-linux-gnu"
          cd "$RUNNER_TEMP"
          base="https://github.com/tamnd/rucc/releases/download/v$RUCC_VERSION"
          curl -fsSLO "$base/$name.tar.gz"
          curl -fsSLO "$base/$name.tar.gz.sha256"
          sha256sum -c "$name.tar.gz.sha256"
          tar xzf "$name.tar.gz"
          echo "RUCC=$RUNNER_TEMP/$name/rucc" >> "$GITHUB_ENV"
      - name: rpg fetch
        run: |
          cargo build --release --workspace
          ./target/release/rpg fetch --pin "$PIN" --no-upstream-check
      - name: build with gcc and with rucc
        run: |
          for cc in gcc "$RUCC"; do
            name=$(basename "$cc")
            ./target/release/rpg build --pin "$PIN" --cc "$cc" --level ${{ matrix.level }} --system autoconf --config minimal \
              --out "$RUNNER_TEMP/$name" --jobs "$(nproc)"
          done
      - name: rucc modules in the gcc server
        run: ./target/release/rpg cross-modules --server "$RUNNER_TEMP/gcc" --modules "$RUNNER_TEMP/rucc"
      - name: gcc modules in the rucc server
        if: ${{ !cancelled() }}
        run: ./target/release/rpg cross-modules --server "$RUNNER_TEMP/rucc" --modules "$RUNNER_TEMP/gcc"
      - name: keep the runs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: rpg-cross-modules-${{ matrix.row }}-${{ env.PIN }}${{ matrix.level }}
          path: |
            ${{ runner.temp }}/gcc/results/
            ${{ runner.temp }}/gcc/records.jsonl
            ${{ runner.temp }}/rucc/results/
            ${{ runner.temp }}/rucc/records.jsonl
          if-no-files-found: ignore

  # The same on M64, Apple Clang's modules in rucc's server and the other way round.
  cross-modules-m64:
    name: cross-modules on M64 at ${{ matrix.level }}
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        level: [-O0, -O2]
    timeout-minutes: 120
    env:
      RUCC_VERSION: ${{ inputs.rucc || '0.20.0' }}
      PIN: ${{ github.event.schedule == '41 4 * * 1' && 'REL_19_STABLE' || inputs.pin || 'REL_18_6' }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: install what the tap tests and the build need
        run: |
          set -euo pipefail
          brew install bison flex make
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          curl -fsSL https://cpanmin.us | perl - --notest --local-lib="$HOME/perl5" IPC::Run
          echo "PERL5LIB=$HOME/perl5/lib/perl5" >> "$GITHUB_ENV"
          echo "JOBS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
      - name: install rucc
        run: |
          set -euo pipefail
          name="rucc-v$RUCC_VERSION-aarch64-apple-darwin"
          cd "$RUNNER_TEMP"
          base="https://github.com/tamnd/rucc/releases/download/v$RUCC_VERSION"
          curl -fsSLO "$base/$name.tar.gz"
          curl -fsSLO "$base/$name.tar.gz.sha256"
          shasum -a 256 -c "$name.tar.gz.sha256"
          tar xzf "$name.tar.gz"
          echo "RUCC=$RUNNER_TEMP/$name/rucc" >> "$GITHUB_ENV"
      - name: rpg fetch
        run: |
          cargo build --release --workspace
          ./target/release/rpg fetch --pin "$PIN" --no-upstream-check
      - name: build with clang and with rucc
        run: |
          for cc in clang "$RUCC"; do
            name=$(basename "$cc")
            ./target/release/rpg build --pin "$PIN" --cc "$cc" --level ${{ matrix.level }} --system autoconf --config minimal \
              --out "$RUNNER_TEMP/$name" --jobs "$JOBS"
          done
      - name: rucc modules in the clang server
        run: |
          ulimit -n 1024
          ./target/release/rpg cross-modules --server "$RUNNER_TEMP/clang" --modules "$RUNNER_TEMP/rucc"
      - name: clang modules in the rucc server
        if: ${{ !cancelled() }}
        run: |
          ulimit -n 1024
          ./target/release/rpg cross-modules --server "$RUNNER_TEMP/rucc" --modules "$RUNNER_TEMP/clang"
      - name: keep the runs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: rpg-cross-modules-M64-${{ env.PIN }}${{ matrix.level }}
          path: |
            ${{ runner.temp }}/clang/results/
            ${{ runner.temp }}/clang/records.jsonl
            ${{ runner.temp }}/rucc/results/
            ${{ runner.temp }}/rucc/records.jsonl
          if-no-files-found: ignore

  # PG2's bisection. The suite run looks for a test that fails with rucc's objects and passes with
  # gcc's, and says so when there is none. The planted run has a check that fails whenever
  # int8.o is exactly rucc's, so the search has to end at that object and at the last
  # transformation rucc makes in it, which shows every step works on a real tree.
  mixed:
    name: mixed at -O2
    if: inputs.rows != 'M64' && inputs.rows != 'W64'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUCC_VERSION: ${{ inputs.rucc || '0.20.0' }}
      PIN: ${{ github.event.schedule == '41 4 * * 1' && 'REL_19_STABLE' || inputs.pin || 'REL_18_6' }}
      PLANTED: src/backend/utils/adt/int8.o
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: install what the tap tests and the build need
        run: |
          sudo apt-get update || echo "at least one apt source is unhappy, carrying on"
          sudo apt-get install -y libipc-run-perl
      - name: install rucc
        run: |
          set -euo pipefail
          name="rucc-v$RUCC_VERSION-x86_64-unknown-linux-gnu"
          cd "$RUNNER_TEMP"
          base="https://github.com/tamnd/rucc/releases/download/v$RUCC_VERSION"
          curl -fsSLO "$base/$name.tar.gz"
          curl -fsSLO "$base/$name.tar.gz.sha256"
          sha256sum -c "$name.tar.gz.sha256"
          tar xzf "$name.tar.gz"
          echo "RUCC=$RUNNER_TEMP/$name/rucc" >> "$GITHUB_ENV"
      - name: build with gcc and with rucc
        run: |
          cargo build --release --workspace
          ./target/release/rpg fetch --pin "$PIN" --no-upstream-check
          for cc in gcc "$RUCC"; do
            name=$(basename "$cc")
            ./target/release/rpg build --pin "$PIN" --cc "$cc" --level -O2 --system autoconf --config minimal \
              --out "$RUNNER_TEMP/$name" --jobs "$(nproc)"
          done
      - name: rpg mixed on the main suite
        run: |
          set +e
          ./target/release/rpg mixed --gcc "$RUNNER_TEMP/gcc" --rucc "$RUNNER_TEMP/rucc" --suite regress \
            --out "$RUNNER_TEMP/mixed-regress" > "$RUNNER_TEMP/mixed-regress.txt" 2>&1
          status=$?
          set -e
          tail -n 20 "$RUNNER_TEMP/mixed-regress.txt"
          [ "$status" = 0 ] || grep -q 'nothing to look for' "$RUNNER_TEMP/mixed-regress.txt"
      - name: rpg mixed on a planted fault
        run: |
          set -o pipefail
          ./target/release/rpg mixed --gcc "$RUNNER_TEMP/gcc" --rucc "$RUNNER_TEMP/rucc" \
            --check "! cmp -s \"\$RPG_BUILD/$PLANTED\" \"$RUNNER_TEMP/rucc/build/$PLANTED\"" \
            --out "$RUNNER_TEMP/mixed-planted" | tee "$RUNNER_TEMP/mixed-planted.txt"
          grep -q "^object: *$PLANTED from" "$RUNNER_TEMP/mixed-planted.txt"
          grep -q '^fuel: *transformation' "$RUNNER_TEMP/mixed-planted.txt"
      - name: the gcc tree is as it was
        run: |
          cd "$RUNNER_TEMP/gcc/build"
          cmp "$PLANTED" "$RUNNER_TEMP/mixed-planted/gcc-objects/$PLANTED"
      - name: summary
        if: always()
        run: |
          for run in regress planted; do
            [ -f "$RUNNER_TEMP/mixed-$run/mixed.md" ] && cat "$RUNNER_TEMP/mixed-$run/mixed.md" >> "$GITHUB_STEP_SUMMARY"
          done
          true
      - name: keep the runs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: rpg-mixed-${{ env.PIN }}
          path: |
            ${{ runner.temp }}/mixed-*/mixed.md
            ${{ runner.temp }}/mixed-*/ir/
            ${{ runner.temp }}/mixed-*/trial-*/*.log
            ${{ runner.temp }}/mixed-*.txt
            ${{ runner.temp }}/gcc/test-mixed-*.log
          if-no-files-found: ignore

  # PG3's sixth criterion: pgbench against the server rucc built, with the balances checked
  # against the history afterwards and again after crash recovery. The criterion asks for an
  # hour on L64, which the nightly gives it at -O2. -O0 runs for twenty minutes.
  stress:
    name: stress at ${{ matrix.level }}
    if: inputs.rows != 'M64' && inputs.rows != 'W64'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        level: [-O0, -O2]
    timeout-minutes: 120
    env:
      RUCC_VERSION: ${{ inputs.rucc || '0.20.0' }}
      PIN: ${{ github.event.schedule == '41 4 * * 1' && 'REL_19_STABLE' || inputs.pin || 'REL_18_6' }}
      MINUTES: ${{ github.event_name == 'pull_request' && '4' || matrix.level == '-O2' && '60' || '20' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: install what configure checks for
        run: |
          sudo apt-get update || echo "at least one apt source is unhappy, carrying on"
          sudo apt-get install -y libipc-run-perl
      - name: install rucc
        run: |
          set -euo pipefail
          name="rucc-v$RUCC_VERSION-x86_64-unknown-linux-gnu"
          cd "$RUNNER_TEMP"
          base="https://github.com/tamnd/rucc/releases/download/v$RUCC_VERSION"
          curl -fsSLO "$base/$name.tar.gz"
          curl -fsSLO "$base/$name.tar.gz.sha256"
          sha256sum -c "$name.tar.gz.sha256"
          tar xzf "$name.tar.gz"
          echo "RUCC=$RUNNER_TEMP/$name/rucc" >> "$GITHUB_ENV"
      - name: rpg fetch and build
        run: |
          cargo build --release --workspace
          ./target/release/rpg fetch --pin "$PIN" --no-upstream-check
          ./target/release/rpg build --pin "$PIN" --cc "$RUCC" --level ${{ matrix.level }} --system autoconf --config minimal \
            --out "$RUNNER_TEMP/pg" --jobs "$(nproc)"
      - name: rpg stress
        run: |
          set -o pipefail
          ./target/release/rpg stress --out "$RUNNER_TEMP/pg" --minutes "$MINUTES" | tee "$RUNNER_TEMP/stress.txt"
      - name: summary
        if: always()
        run: |
          {
            echo "### $PIN stress at ${{ matrix.level }} with rucc $RUCC_VERSION for $MINUTES minutes"
            echo
            grep '^stress:' "$RUNNER_TEMP/stress.txt" | sed 's/^/- /' || echo "rpg stress did not get as far as a result"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: keep the run
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: rpg-stress-${{ env.PIN }}${{ matrix.level }}
          path: |
            ${{ runner.temp }}/pg/stress/
            ${{ runner.temp }}/pg/records.jsonl
            ${{ runner.temp }}/pg/build.log
          if-no-files-found: ignore

  # The first box of PG3's rucc list: a probe rucc answers differently from gcc under meson, the
  # way PG1 checked autoconf. Configure alone with each compiler, then compare what they decided.
  probes:
    name: probes on ${{ matrix.row }} under ${{ matrix.system }}
    if: inputs.rows != 'M64' && inputs.rows != 'W64'
    runs-on: ${{ matrix.row == 'LA64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        row: [L64, LA64]
        system: [autoconf, meson]
    timeout-minutes: 30
    env:
      RUCC_VERSION: ${{ inputs.rucc || '0.20.0' }}
      PIN: ${{ github.event.schedule == '41 4 * * 1' && 'REL_19_STABLE' || inputs.pin || 'REL_18_6' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: install what configure needs
        run: |
          sudo apt-get update || echo "at least one apt source is unhappy, carrying on"
          sudo apt-get install -y libipc-run-perl meson ninja-build bison flex gcc-14
      - name: install rucc
        run: |
          set -euo pipefail
          name="rucc-v$RUCC_VERSION-$(uname -m)-unknown-linux-gnu"
          cd "$RUNNER_TEMP"
          base="https://github.com/tamnd/rucc/releases/download/v$RUCC_VERSION"
          curl -fsSLO "$base/$name.tar.gz"
          curl -fsSLO "$base/$name.tar.gz.sha256"
          sha256sum -c "$name.tar.gz.sha256"
          tar xzf "$name.tar.gz"
          echo "RUCC=$RUNNER_TEMP/$name/rucc" >> "$GITHUB_ENV"
      - name: rpg fetch
        run: |
          cargo build --release --workspace
          ./target/release/rpg fetch --pin "$PIN" --no-upstream-check
      # gcc-14 rather than the runner's gcc 13, which does not have -Wmissing-variable-declarations
      # and so answers that probe differently from rucc and from the gcc-16 the rows name.
      - name: configure with gcc and with rucc
        run: |
          for cc in gcc-14 "$RUCC"; do
            ./target/release/rpg build --pin "$PIN" --cc "$cc" --system ${{ matrix.system }} --config minimal \
              --out "$RUNNER_TEMP/$(basename "$cc")" --configure-only
          done
      - name: rpg config-diff
        run: |
          set -o pipefail
          ./target/release/rpg config-diff --a "$RUNNER_TEMP/gcc-14" --b "$RUNNER_TEMP/rucc" --row ${{ matrix.row }} | tee "$RUNNER_TEMP/diff.txt"
      - name: summary
        if: always()
        run: |
          {
            echo "### $PIN probes on ${{ matrix.row }} under ${{ matrix.system }}, gcc-14 against rucc $RUCC_VERSION"
            echo
            echo '```'
            cat "$RUNNER_TEMP/diff.txt" 2>/dev/null || echo "rpg config-diff did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: keep the logs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: rpg-probes-${{ matrix.row }}-${{ env.PIN }}-${{ matrix.system }}
          path: |
            ${{ runner.temp }}/gcc-14/configure.log
            ${{ runner.temp }}/rucc/configure.log
            ${{ runner.temp }}/gcc-14/build/meson-logs/meson-log.txt
            ${{ runner.temp }}/rucc/build/meson-logs/meson-log.txt
            ${{ runner.temp }}/gcc-14/build/src/include/pg_config.h
            ${{ runner.temp }}/rucc/build/src/include/pg_config.h
          if-no-files-found: ignore

  # PG2's second criterion: no server function with a frame more than twice gcc's at -O2, or more
  # than four times gcc's -O2 frame at -O0. rpg frames measures both against one gcc -O2 build and
  # the summary shows how many functions are over each bound. It is a measurement, so the job
  # fails only when a build or the measuring does.
  frames:
    name: frames against gcc-14 -O2
    if: inputs.rows != 'M64' && inputs.rows != 'W64'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUCC_VERSION: ${{ inputs.rucc || '0.20.0' }}
      PIN: ${{ github.event.schedule == '41 4 * * 1' && 'REL_19_STABLE' || inputs.pin || 'REL_18_6' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: install what configure checks for
        run: |
          sudo apt-get update || echo "at least one apt source is unhappy, carrying on"
          sudo apt-get install -y libipc-run-perl gcc-14
      - name: install rucc
        run: |
          set -euo pipefail
          name="rucc-v$RUCC_VERSION-x86_64-unknown-linux-gnu"
          cd "$RUNNER_TEMP"
          base="https://github.com/tamnd/rucc/releases/download/v$RUCC_VERSION"
          curl -fsSLO "$base/$name.tar.gz"
          curl -fsSLO "$base/$name.tar.gz.sha256"
          sha256sum -c "$name.tar.gz.sha256"
          tar xzf "$name.tar.gz"
          echo "RUCC=$RUNNER_TEMP/$name/rucc" >> "$GITHUB_ENV"
      - name: build with gcc-14 at -O2 and rucc at -O2 and -O0
        run: |
          cargo build --release --workspace
          ./target/release/rpg fetch --pin "$PIN" --no-upstream-check
          ./target/release/rpg build --pin "$PIN" --cc gcc-14 --level -O2 --system autoconf --config minimal \
            --out "$RUNNER_TEMP/gcc-O2" --jobs "$(nproc)"
          for level in -O2 -O0; do
            ./target/release/rpg build --pin "$PIN" --cc "$RUCC" --level $level --system autoconf --config minimal \
              --out "$RUNNER_TEMP/rucc$level" --jobs "$(nproc)"
          done
      - name: rpg frames
        run: |
          for level in -O2 -O0; do
            ./target/release/rpg frames --a "$RUNNER_TEMP/gcc-O2" --b "$RUNNER_TEMP/rucc$level" \
              --out "$RUNNER_TEMP/frames/rucc$level.md"
          done
      - name: summary
        if: always()
        run: |
          {
            echo "### $PIN stack frames, rucc $RUCC_VERSION against gcc-14 -O2"
            echo
            echo "The bounds are 2 times at -O2 and 4 times at -O0."
            for level in -O2 -O0; do
              echo
              echo "#### rucc $level"
              sed -n '/^## Ratio/,/^## The 50 largest ratios/p' "$RUNNER_TEMP/frames/rucc$level.md" | sed '1d;$d' || echo "no report"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: keep the reports
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: rpg-frames-${{ env.PIN }}
          path: ${{ runner.temp }}/frames/
          if-no-files-found: ignore
