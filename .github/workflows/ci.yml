# The per commit gate: formatting, lints, the house style and the unit tests.
#
# Nothing here builds Postgres. A minimal build takes minutes on a fast machine and the suites
# need an unprivileged user and a configured machine, which is what the rows in rows.toml and the
# scripts in provision/ are for. The parsers the harness depends on are tested here with inline
# fixtures instead.
#
# Actions are pinned to a patch version, as in rucc-real-corpus, so that a result can be
# reproduced from the commit alone.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  quick:
    name: format, lints and house style
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets
      - name: prose style
        run: ./scripts/style.sh
      - name: shell scripts parse
        run: for f in provision/*.sh scripts/*.sh; do bash -n "$f"; done

  test:
    name: test on ${{ matrix.name }}
    needs: quick
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64
            os: ubuntu-24.04
          - name: linux arm64
            os: ubuntu-24.04-arm
          - name: macos arm64
            os: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo test
        run: cargo test --workspace

  # rpg end to end on a real tree: the pinned Postgres built by a released rucc at -O0 with the
  # minimal configuration, then every suite `rpg test` knows run against it. The unit tests above
  # check the parsing against captured text, and this checks it against what make really prints.
  end-to-end:
    name: rpg build and every suite
    needs: quick
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUCC_VERSION: "0.12.3"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: install what the tap tests and the build need
        run: |
          sudo apt-get update || echo "at least one apt source is unhappy, carrying on"
          sudo apt-get install -y libipc-run-perl
      - name: install rucc
        run: |
          set -euo pipefail
          name="rucc-v$RUCC_VERSION-x86_64-unknown-linux-gnu"
          cd "$RUNNER_TEMP"
          base="https://github.com/tamnd/rucc/releases/download/v$RUCC_VERSION"
          curl -fsSLO "$base/$name.tar.gz"
          curl -fsSLO "$base/$name.tar.gz.sha256"
          sha256sum -c "$name.tar.gz.sha256"
          tar xzf "$name.tar.gz"
          echo "RUCC=$RUNNER_TEMP/$name/rucc" >> "$GITHUB_ENV"
      - name: rpg build
        run: |
          cargo build --release -p rpg
          ./target/release/rpg build --cc "$RUCC" --level -O0 --system autoconf --config minimal \
            --out "$RUNNER_TEMP/pg" --jobs "$(nproc)"
      - name: rpg test --suite regress
        run: ./target/release/rpg test --suite regress --out "$RUNNER_TEMP/pg"
      - name: rpg test --suite isolation
        if: success() || failure()
        run: ./target/release/rpg test --suite isolation --out "$RUNNER_TEMP/pg"
      - name: rpg test --suite ecpg
        if: success() || failure()
        run: ./target/release/rpg test --suite ecpg --out "$RUNNER_TEMP/pg"
      - name: rpg test --suite contrib
        if: success() || failure()
        run: ./target/release/rpg test --suite contrib --out "$RUNNER_TEMP/pg"
      - name: rpg test --suite modules
        if: success() || failure()
        run: ./target/release/rpg test --suite modules --out "$RUNNER_TEMP/pg"
      - name: keep the runs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: rpg-end-to-end
          path: |
            ${{ runner.temp }}/pg/results/
            ${{ runner.temp }}/pg/records.jsonl
          if-no-files-found: ignore
