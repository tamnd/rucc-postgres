# Differences rpg config-diff expects between a tree configured with rucc and one configured with
# the row's reference compiler, each with the reason it does not change which code is compiled.
#
# An entry is `source`, which is `pg_config.h`, `Makefile.global` or `probe`, the `name` of the
# define, variable or question, and `why`. A name ending in `*` matches every name that starts
# with the part before it. A difference with no entry fails the comparison, and an entry that
# matched nothing is printed so it can be taken out. An entry may add `rows`, the rows of rows.toml
# it is for, when the difference belongs to one platform; `rpg config-diff --row` picks them, and
# an entry without `rows` is for every row.

[[divergence]]
source = "pg_config.h"
name = "PG_VERSION_STR"
why = "The string `SELECT version()` returns, which names the compiler. Nothing tests it with #if, so it changes a string constant and no code."

# REL_19_STABLE asks for typeof_unqual. configure and meson try the C23 keyword first and the GNU
# spelling second, and stop at the first that compiles. gcc-14 defaults to gnu17, where only
# `__typeof_unqual__` is a keyword, so it defines typeof_unqual to that. rucc defaults to C23, as
# gcc 15 and later do, so the first try works and nothing needs defining. Either way c.h spells
# it typeof_unqual and gets the same keyword.
[[divergence]]
source = "pg_config.h"
name = "typeof_unqual"
why = "gcc-14 defaults to gnu17 and gets `__typeof_unqual__`, rucc defaults to C23 like gcc 15 and later and needs no define. Both builds use the same keyword."

[[divergence]]
source = "probe"
name = "for typeof_unqual"
why = "configure's answer is the spelling that compiled first, `typeof_unqual` in C23 and `__typeof_unqual__` in gnu17. See the pg_config.h entry."

[[divergence]]
source = "probe"
name = "Checking if \"typeof_unqual\" compiles"
why = "meson tries the C23 keyword first. It is a keyword in rucc's default C23 and not in gcc-14's default gnu17."

[[divergence]]
source = "probe"
name = "Checking if \"__typeof_unqual__\" compiles"
why = "meson only asks for the GNU spelling when the C23 keyword failed, so under rucc it never asks."

# LA64 and REL_18_STABLE's SVE popcount. configure and meson compile a use of the arm_sve.h
# intrinsics, svcnt_u64_x, svadd_u64_x and the rest, and when it builds Postgres compiles
# pg_popcount_aarch64.c's SVE path and picks it at run time on a CPU that has SVE. rucc has no
# arm_sve.h and no sizeless types yet, so the probe stops at the missing header, the define is
# left out, and pg_popcount_aarch64.c takes its NEON path on every CPU. That is a slower popcount
# on SVE hardware and the same answers. The CRC32C probes agree on LA64: both compilers need
# -march=armv8-a+crc+simd and get the ARMv8 CRC instructions with a runtime check.
[[divergence]]
source = "pg_config.h"
name = "USE_SVE_POPCNT_WITH_RUNTIME_CHECK"
rows = ["LA64"]
why = "rucc has no arm_sve.h yet, so the SVE popcount probe fails at the missing header and pg_popcount_aarch64.c takes its NEON path, which gcc's build also takes on a CPU without SVE."

[[divergence]]
source = "probe"
name = "for svcnt_x"
rows = ["LA64"]
why = "configure's SVE popcount probe includes arm_sve.h, which rucc does not have yet. See the pg_config.h entry."

[[divergence]]
source = "probe"
name = "Checking if \"SVE popcount\" : links"
rows = ["LA64"]
why = "meson's SVE popcount probe includes arm_sve.h, which rucc does not have yet. See the pg_config.h entry."

# LA64 and REL_19_STABLE's PMULL CRC-32C. configure and meson build a program that runs pmull and
# pmull2 from inline assembly on uint64x2_t operands with the "w" constraint, and when it builds
# Postgres compiles the vectorized CRC-32C and picks it at run time on a CPU with the crypto
# extension. rucc does not take a vector as an operand in a register constraint yet, so the probe
# fails to compile, the define is left out, and Postgres uses the ARMv8 CRC instructions alone,
# which both builds use on a CPU without PMULL. That is a slower CRC on long buffers and the same
# answers.
[[divergence]]
source = "pg_config.h"
name = "USE_PMULL_CRC32C_WITH_RUNTIME_CHECK"
rows = ["LA64"]
why = "rucc does not take a vector operand in an asm register constraint yet, so the PMULL probe fails and Postgres uses the ARMv8 CRC instructions alone, which gcc's build also uses on a CPU without PMULL."

[[divergence]]
source = "probe"
name = "for pmull and pmull2"
rows = ["LA64"]
why = "configure's PMULL probe hands uint64x2_t operands to inline assembly, which rucc does not take yet. See the pg_config.h entry."

[[divergence]]
source = "probe"
name = "for vectorized CRC-32C"
rows = ["LA64"]
why = "configure picks the PMULL CRC-32C only when the PMULL probe built. See the pg_config.h entry."

[[divergence]]
source = "probe"
name = "Checking if \"CRYPTO CRC32C\" : links"
rows = ["LA64"]
why = "meson's PMULL probe hands uint64x2_t operands to inline assembly, which rucc does not take yet. See the pg_config.h entry."
